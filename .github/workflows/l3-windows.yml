name: l3-windows

# §8.4: L3-Windows идёт по расписанию и обязательно перед релизом, а не на
# каждый PR — namespace-изоляции нет, и раннер один на всех.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

env:
  GO_VERSION: '1.26'

jobs:
  l3-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }

      # Скелет. Тела ещё нет и не может быть: §7.2 (распространение подписанной
      # wintun.dll) — блокер, без адаптера Wintun не проходит ни один L3-Windows,
      # и план держит этот вопрос на этапе 8.
      #
      # Что здесь появится, когда блокер снимут:
      #   1. гейт-пара T22 + T23-slow первой — оба восстанавливают состояние
      #      сети, но из разных исходных, и сломанный teardown любого из них
      #      оставит раннер без сети (§8.4, D9);
      #   2. остальной набор — только после зелёной пары;
      #   3. проверки: адаптер Wintun с ожидаемым именем, маршруты с метрикой 0,
      #      DNS на адаптере, named pipe с ожидаемым SDDL и недоступный другому
      #      пользователю, после down адаптер удалён.
      - name: L3-Windows (скелет)
        run: |
          go build ./...
          go vet ./...
          echo "L3-Windows не запущен: §7.2 (wintun.dll) — блокер, этап 8"

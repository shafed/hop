name: l4-install

# §8.5: тест установки — уровень L4, по расписанию. Он ставит продукт в систему
# целиком, поэтому живёт рядом с l3-windows и l3-macos, а не в ci.yml.
#
# Исключение — задача lint: синтаксис скриптов проверяется и на PR, который их
# трогает. Опечатка в install.sh не должна ждать ночного прогона, а сама
# установка на PR всё равно не запускается (see `if` ниже).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/l4-install.yml'

env:
  GO_VERSION: '1.26'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Синтаксис sh-скриптов
        run: |
          set -eu
          for f in packaging/linux/*.sh packaging/macos/*.sh; do
            bash -n "$f"
            echo "ok $f"
          done

      # plutil есть только на macOS, поэтому здесь — разбор XML. Битый plist
      # launchd молча не грузит, и узнать об этом на раннере дороже, чем тут.
      - name: Разбор plist
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for p in sorted(glob.glob('packaging/macos/*.plist')):
              ET.parse(p)
              print('ok', p)
          PY

      - name: Разбор PowerShell
        shell: pwsh
        run: |
          Get-ChildItem packaging/windows/*.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { throw "$($_.Name): $($errs[0].Message)" }
            Write-Host "ok $($_.Name)"
          }

  # I1–I4 (§8.5) целиком. Туннель здесь не поднимается намеренно: датаплейн —
  # работа L3, и она идёт в своём netns. Подмена маршрутов на общем раннере
  # отобрала бы у него сеть.
  l4-linux:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }

      - name: Собрать в dist/
        run: |
          mkdir -p dist
          go build -o dist/hopd ./cmd/hopd
          go build -o dist/hop ./cmd/hop

      # Снимок состояния сети до установки — общий платформенный контракт §8.4.
      # Счётчики аренды из вывода вычищаются: они тикают сами и к установке
      # отношения не имеют.
      - name: Снимок доустановочного состояния
        run: |
          set -eu
          cat > /tmp/snap.sh <<'EOF'
          #!/usr/bin/env bash
          set -eu
          { ip -o addr show; echo ---; ip -o route show; echo ---; ip rule show; } |
            sed -e 's/ valid_lft.*//' -e 's/ expires [0-9]*sec//'
          EOF
          chmod +x /tmp/snap.sh
          /tmp/snap.sh > /tmp/net-before.txt
          # Чистая машина: ничего из установки на ней быть не должно.
          test ! -e /usr/local/sbin/hopd
          test ! -e /etc/systemd/system/hopd.service
          ! getent group hop

      - name: I1 — установка штатным способом
        run: sudo env BUILD_DIR="$PWD/dist" packaging/linux/install.sh

      - name: I1 — демон зарегистрирован и запущен, агент включён на логин
        run: |
          set -eux
          systemctl is-active --quiet hopd.service
          test "$(systemctl is-enabled hopd.service)" = enabled
          test -L /etc/systemd/system/multi-user.target.wants/hopd.service
          test -x /usr/local/sbin/hopd
          test -x /usr/local/bin/hop
          test -f /etc/modules-load.d/hop.conf

          # Сокет поднимает сам сервис — ждём его появления, а не гадаем.
          for _ in $(seq 50); do [ -S /run/hop.sock ] && break; sleep 0.2; done
          test -S /run/hop.sock
          test "$(stat -c '%U %G %a' /run/hop.sock)" = "root hop 660"

          # §6.13: агент — при логине. Ссылку кладёт `systemctl --global enable`.
          test -f /etc/systemd/user/hop.service
          test -L /etc/systemd/user/default.target.wants/hop.service
          grep -q '^ExecStart=/usr/local/bin/hop' /etc/systemd/user/hop.service

          id -nG "$USER" | tr ' ' '\n' | grep -qx hop

      # §6.1: право открыть канал даёт группа, а не факт входа в систему.
      # Проверка идёт мимо CLI намеренно — она про права на сокет, а не про
      # команды агента.
      - name: I1 — сокет открыт группе hop и закрыт постороннему (§6.1)
        run: |
          set -eu
          cat > /tmp/probe.py <<'PY'
          import socket
          s = socket.socket(socket.AF_UNIX)
          s.connect("/run/hop.sock")
          print("connected")
          PY
          chmod 0644 /tmp/probe.py

          sg hop -c "python3 /tmp/probe.py"

          if sudo -u nobody python3 /tmp/probe.py 2>/tmp/probe.err; then
            echo "сокет открыт постороннему пользователю — §6.1 нарушен"
            exit 1
          fi
          grep -qi "permission denied" /tmp/probe.err

      # Настоящей перезагрузки на hosted-раннере нет. Проверяется то, из чего
      # она состоит: юнит включён в multi-user.target, и упавший сервис
      # возвращается сам. Полный I2 — только на своём железе или в VM.
      - name: I2 — сервис поднимается сам (перезагрузка эмулирована)
        run: |
          set -eux
          grep -q 'WantedBy=multi-user.target' /etc/systemd/system/hopd.service
          before=$(systemctl show -p MainPID --value hopd.service)
          sudo systemctl kill -s KILL hopd.service
          after=$before
          for _ in $(seq 100); do
            after=$(systemctl show -p MainPID --value hopd.service)
            state=$(systemctl show -p ActiveState --value hopd.service)
            [ "$state" = active ] && [ "$after" != 0 ] && [ "$after" != "$before" ] && break
            sleep 0.2
          done
          test "$after" != "$before"
          systemctl is-active --quiet hopd.service

      - name: I4 — установка поверх предыдущей версии
        run: |
          set -eux
          store="$HOME/.local/share/hop"
          test -d "$store"
          test "$(stat -c %a "$store")" = 700
          echo canary > "$store/canary"
          before=$(systemctl show -p MainPID --value hopd.service)

          sudo env BUILD_DIR="$PWD/dist" packaging/linux/install.sh

          # Состояние и профили сохранены, права не разъехались.
          test -f "$store/canary"
          test "$(stat -c %a "$store")" = 700
          test "$(stat -c %U "$store")" = "$USER"
          # Демон перезапущен, а не просто «остался жив».
          systemctl is-active --quiet hopd.service
          test "$(systemctl show -p MainPID --value hopd.service)" != "$before"

      - name: I3 — снятие
        run: sudo packaging/linux/uninstall.sh

      - name: I3 — файлов нет, снимок сети совпал, профили целы
        run: |
          set -eux
          test ! -e /usr/local/sbin/hopd
          test ! -e /usr/local/bin/hop
          test ! -e /etc/systemd/system/hopd.service
          test ! -e /etc/systemd/user/hop.service
          test ! -e /etc/systemd/user/default.target.wants/hop.service
          test ! -e /etc/modules-load.d/hop.conf
          test ! -e /run/hop.sock
          ! getent group hop
          ! systemctl list-unit-files | grep -q '^hopd\.service'

          # Данные пользователя снятие переживают: их убирает только --purge.
          test -f "$HOME/.local/share/hop/canary"

          /tmp/snap.sh > /tmp/net-after.txt
          diff -u /tmp/net-before.txt /tmp/net-after.txt

      - name: I3 — деинсталлятор идемпотентен, --purge убирает стор
        run: |
          set -eux
          sudo packaging/linux/uninstall.sh
          sudo packaging/linux/uninstall.sh --purge
          test ! -e "$HOME/.local/share/hop"

  # macOS: скрипты гоняются целиком, но I1 проверяется только в части
  # «зарегистрирован». «И запущен» проверить нечем: netstate.System() для darwin
  # ещё не написан, и hopd падает на снятии снимка сети — это этап 8, не
  # инсталлятор.
  l4-macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }

      - name: Собрать в dist/
        run: |
          mkdir -p dist
          go build -o dist/hopd ./cmd/hopd
          go build -o dist/hop ./cmd/hop

      - name: plutil — plist валидны
        run: |
          set -eu
          for p in packaging/macos/*.plist; do plutil -lint "$p"; done

      - name: I1 — установка штатным способом
        run: sudo env BUILD_DIR="$PWD/dist" packaging/macos/install.sh

      - name: I1 — демон зарегистрирован, агент и группа на месте
        run: |
          set -eux
          sudo launchctl print system/io.github.shafed.hopd > /tmp/daemon.txt
          grep -q 'io.github.shafed.hopd' /tmp/daemon.txt
          test -f /Library/LaunchDaemons/io.github.shafed.hopd.plist
          test "$(stat -f '%Su %Sg %Lp' /Library/LaunchDaemons/io.github.shafed.hopd.plist)" = "root wheel 644"
          test -x /usr/local/libexec/hopd
          test -x /usr/local/bin/hop
          test -f "$HOME/Library/LaunchAgents/io.github.shafed.hop.plist"
          test "$(stat -f %Lp "$HOME/.local/share/hop")" = 700
          dseditgroup -o checkmember -m "$USER" hop
          echo "запуск демона не проверяется: платформенный слой macOS — этап 8"

      - name: I4 — установка поверх предыдущей версии
        run: |
          set -eux
          echo canary > "$HOME/.local/share/hop/canary"
          sudo env BUILD_DIR="$PWD/dist" packaging/macos/install.sh
          test -f "$HOME/.local/share/hop/canary"
          test "$(stat -f %Lp "$HOME/.local/share/hop")" = 700
          sudo launchctl print system/io.github.shafed.hopd > /dev/null

      - name: I3 — снятие
        run: |
          set -eux
          sudo packaging/macos/uninstall.sh
          test ! -e /Library/LaunchDaemons/io.github.shafed.hopd.plist
          test ! -e /usr/local/libexec/hopd
          test ! -e /usr/local/bin/hop
          test ! -e /var/run/hop.sock
          test ! -e "$HOME/Library/LaunchAgents/io.github.shafed.hop.plist"
          ! sudo launchctl print system/io.github.shafed.hopd
          ! dseditgroup -o read hop
          test -f "$HOME/.local/share/hop/canary"
          sudo packaging/macos/uninstall.sh --purge
          test ! -e "$HOME/.local/share/hop"

  # Windows: установка не гоняется, и это не забывчивость. Служба
  # регистрируется правильно, но hopd не умеет отвечать диспетчеру служб
  # (обработчика golang.org/x/sys/windows/svc в cmd/hopd нет), поэтому
  # Start-Service обязан упасть с 1053. Постоянно красная ночная задача учит
  # игнорировать красное, поэтому здесь гоняется только то, что уже работает.
  #
  # Появится обработчик SCM и платформенный слой (этап 8) — сюда приезжают
  # install.ps1 / I1–I4 тем же порядком, что на Linux.
  l4-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # §7.2 закрыт решением docs/wintun.md: закреплённые версия и sha256,
      # скачивание при сборке. Проверяется здесь, потому что ломается это
      # молча — сменился архив у upstream, и подписанной библиотеки нет.
      - name: wintun — закреплённая версия и контрольная сумма (§7.2)
        shell: pwsh
        run: .\packaging\windows\fetch-wintun.ps1

      - name: wintun — библиотека подписана
        shell: pwsh
        run: |
          $dll = 'dist\wintun.dll'
          if (-not (Test-Path $dll)) { throw "нет $dll" }
          $sig = Get-AuthenticodeSignature $dll
          if ($sig.Status -ne 'Valid') { throw "подпись $dll : $($sig.Status)" }
          Write-Host "подписант: $($sig.SignerCertificate.Subject)"

      - name: Скелет установки Windows
        shell: pwsh
        run: |
          Write-Host 'L4-Windows не запущен: у hopd нет обработчика службы Windows (SCM), платформенный слой — этап 8'

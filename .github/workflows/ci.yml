name: ci

on:
  pull_request:
  push:
    branches: [main]

# go.mod требует 1.26.3: столько просит gvisor.dev/gvisor, из которого берутся
# заголовки для reject-респондера (§6.2, Apache-2.0). Версия здесь и версия в
# go.mod обязаны совпадать — CI, который ставит меньше, не собирает продукт.
env:
  GO_VERSION: '1.26'

jobs:
  # L1/L2 — без прав, на всех трёх ОС, на каждый PR (§8.4, матрица запуска).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...

  # Линт §8.1: настоящее время живёт только в internal/clock.
  realtimelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - run: go run ./cmd/realtimelint .

  # Линт §8: за утверждением документа о состоянии обязано стоять исполнимое.
  # -git=false — ветки проходов живут только на машине разработчика, у чекаута
  # их нет; остальные три проверки идут здесь целиком.
  doclint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - run: go test -count=1 ./internal/doclint
      - run: go run ./cmd/doclint -git=false .

  # Негативная задача §8: тест, зелёный при выключенной политике, — сломан.
  # Её собственная исправность проверена мета-тестом TestMetaCheck.
  negcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - run: go test -count=1 -run TestMetaCheck ./internal/negcheck
      - run: go run ./cmd/negcheck

  # L3-Linux — на каждый PR (§8.4): единственная платформа, где полный e2e
  # дёшев. Всё поднимается в отдельном netns, поэтому раннер не теряет сеть,
  # что бы тест ни сломал.
  l3-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      # Бинари собираются до входа в namespace: под sudo `go build` пошёл бы в
      # чужой кеш и полез бы в сеть за модулями.
      - run: |
          go build -o /tmp/hopd ./cmd/hopd
          go build -o /tmp/hop ./cmd/hop
          go test -c -o /tmp/l3.test ./internal/l3
      - name: T21, T22, T23-fast, T23-slow, T23b, T24, T29
        run: |
          sudo -E env \
            HOP_L3=1 \
            HOP_L3_BIN_HOPD=/tmp/hopd \
            HOP_L3_BIN_HOP=/tmp/hop \
            unshare -n /tmp/l3.test -test.v -test.timeout 10m

  # ЕДИНСТВЕННЫЙ порог, ломающий сборку: B1b на Windows ≥ 500 Мбит/с (D4).
  b1-gate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - run: go run ./cmd/b1 -mode boundary -duration 5s
      - run: go run ./cmd/b1 -mode boundary -duration 5s -json > b1-windows.json
      - uses: actions/upload-artifact@v4
        with: { name: b1-windows, path: b1-windows.json }

  # B3 (§8.6): NAT-таблица full-cone под нагрузкой. Порог не в скорости —
  # потерянный ответ роняет замер. Гоняется на трёх ОС: netstack поверх
  # настоящей границы этой ОС, прав не требует.
  b3-fullcone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - run: go run ./cmd/b3 -mode fullcone

  # Долг этапа 1: латентность поверх netstack, Linux против Windows. Порога
  # нет — базовая линия. B1 показал, что стоимость границы тонет в пропускной
  # способности на крупных пакетах; здесь видно, во что она обходится на
  # интерактивном трафике.
  netstack-rtt-baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - run: go run ./cmd/b3 -mode rtt
      - run: go run ./cmd/b3 -mode rtt -json > rtt-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        with: { name: 'netstack-rtt-${{ matrix.os }}', path: 'rtt-${{ matrix.os }}.json' }

  # Базовая линия без порога: на Unix границы в горячем пути нет, и порог
  # гейтил бы скорость gvisor и syscall'ов, а не решение §5.3 (D4).
  b1-baseline-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - run: go run ./cmd/b1 -mode boundary -duration 5s -gate=false
      # Реальный TUN-fd и контрольный замер GSO — только Linux, в своём netns.
      # Не гейт: §4 вынес GSO за v1, число нужно ради цены его возврата.
      - if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          go build -o b1 ./cmd/b1
          unshare -Urn ./b1 -mode tun -duration 5s -gate=false
